name: Build Android Agent APK

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'mobile-agent/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: |
          cd mobile-agent
          if [ -f gradlew ]; then
            chmod +x gradlew
          else
            gradle wrapper --gradle-version 8.5
            chmod +x gradlew
          fi

      - name: Build Android Debug and Signed APK
        run: |
          cd mobile-agent
          # Ensure fixed debug.keystore is present with constant signature
          if [ ! -f app/debug.keystore ]; then
            echo "Restoring permanent fixed debug.keystore..."
            echo "" | base64 -d > app/debug.keystore
          fi
          ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FleetGuard-Agent-APK
          path: mobile-agent/app/build/outputs/apk/**/*.apk
          retention-days: 30
