plugins {
    id 'com.android.application'
}

android {
    namespace 'com.afg.fleetgps.agent'
    compileSdk 34

    defaultConfig {
        applicationId "com.afg.fleetgps.agent"
        minSdk 21 // Android 5.0 Lollipop and above (fully compatible with Android 8.0 Oreo)
        targetSdk 34
        versionCode 2
        versionName "1.0.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        debugConfig {
            if (file("debug.keystore").exists()) {
                storeFile file("debug.keystore")
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
        releaseConfig {
            if (file("debug.keystore").exists()) {
                storeFile file("debug.keystore")
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (file("debug.keystore").exists()) {
                signingConfig signingConfigs.releaseConfig
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            if (file("debug.keystore").exists()) {
                signingConfig signingConfigs.debugConfig
            }
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core:1.12.0'
    
    // Play Services Location for accurate low-power GPS fixes
    implementation 'com.google.android.gms:play-services-location:21.1.0'
}
